version: 2

models:
  - name: rpt_kpi_overview
    description: KPI overview for NYC Yellow Taxi dashboard.

  - name: rpt_monthly_demand_revenue
    description: Monthly demand and revenue trend with month-over-month growth.

  - name: rpt_peak_hour_analysis
    description: Demand and revenue performance by pickup hour.

  - name: rpt_location_performance
    description: Pickup location performance by trips, revenue, and contribution.

  - name: rpt_payment_behavior
    description: Payment behavior analysis by payment type.

  - name: vw_yellow_taxi_dashboard_analytics
    description: Dashboard-ready wide analytics view for Power BI or Tableau.
    columns:
      - name: trip_id
        tests:
          - not_null
          - unique

      - name: pickup_date
        tests:
          - not_null

      - name: pickup_year_month
        tests:
          - not_null

      - name: pickup_borough
        tests:
          - not_null

      - name: pickup_zone
        tests:
          - not_null

      - name: payment_type_name
        tests:
          - not_null

      - name: total_amount
        tests:
          - not_null
          
  - name: rpt_daily_demand
    description: Daily taxi demand model with daily growth and 7-day moving average.
    columns:
    - name: pickup_date
      tests:
        - not_null
        - unique

    - name: total_trips
      tests:
        - not_null

  - name: rpt_day_of_week_demand
    description: Taxi demand performance by day of week.
    columns:
      - name: day_of_week
        tests:
          - not_null
          - unique

      - name: avg_trips_per_day
        tests:
          - not_null

  - name: rpt_hourly_demand
    description: Taxi demand performance by pickup hour.
    columns:
      - name: pickup_hour
        tests:
          - not_null
          - unique

      - name: total_trips
        tests:
          - not_null

  - name: rpt_demand_heatmap
    description: Demand pattern by day of week and pickup hour.
    columns:
      - name: day_of_week
        tests:
          - not_null

      - name: pickup_hour
        tests:
          - not_null

  - name: rpt_pickup_location_performance
    description: Pickup-zone performance by demand, revenue, trip behavior, and contribution.
    columns:
      - name: pickup_location_id
        tests:
          - not_null
          - unique

      - name: total_trips
        tests:
          - not_null

      - name: total_revenue
        tests:
          - not_null

  - name: rpt_dropoff_location_performance
    description: Dropoff-zone performance by trip arrivals and revenue.
    columns:
      - name: dropoff_location_id
        tests:
          - not_null
          - unique

      - name: total_trips
        tests:
          - not_null

  - name: rpt_borough_flow_performance
    description: Directed borough-to-borough taxi trip flow analysis.
    columns:
      - name: pickup_borough
        tests:
          - not_null

      - name: dropoff_borough
        tests:
          - not_null

      - name: total_trips
        tests:
          - not_null

  - name: rpt_route_performance
    description: Directed pickup-to-dropoff route performance by demand, revenue, and trip behavior.
    columns:
      - name: pickup_location_id
        tests:
          - not_null

      - name: dropoff_location_id
        tests:
          - not_null

      - name: route_name
        tests:
          - not_null

      - name: total_trips
        tests:
          - not_null

  - name: rpt_location_role_comparison
    description: Comparison of pickup and dropoff roles for every taxi zone.
    columns:
      - name: location_id
        tests:
          - not_null
          - unique

      - name: location_role
        tests:
          - not_null
          - accepted_values:
              values:
                - Net pickup origin
                - Net dropoff destination
                - Balanced location role