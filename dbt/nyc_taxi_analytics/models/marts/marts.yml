version: 2

models:
  - name: fact_yellow_taxi_trips
    description: Fact table containing one row per cleaned yellow taxi trip.
    columns:
      - name: trip_id
        description: Unique trip identifier generated from business columns.
        tests:
          - not_null
          - unique

      - name: pickup_date_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_id

      - name: dropoff_date_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_id

      - name: pickup_location_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_location')
              field: location_id

      - name: dropoff_location_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_location')
              field: location_id

      - name: payment_type_id
        tests:
          - not_null
          - accepted_values:
              values: [0, 1, 2, 3, 4, 5]
              quote: false

      - name: rate_code_id
        tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4, 5, 6]
              quote: false

      - name: passenger_count
        tests:
          - not_null

      - name: trip_distance
        tests:
          - not_null

      - name: fare_amount
        tests:
          - not_null

      - name: total_amount
        tests:
          - not_null

  - name: dim_date
    description: Date dimension for taxi trip analysis.
    columns:
      - name: date_id
        tests:
          - not_null
          - unique

      - name: full_date
        tests:
          - not_null
          - unique

  - name: dim_location
    description: Taxi zone location dimension.
    columns:
      - name: location_id
        tests:
          - not_null
          - unique

  - name: dim_payment_type
    description: Payment type dimension.
    columns:
      - name: payment_type_id
        tests:
          - not_null
          - unique

  - name: dim_rate_code
    description: Rate code dimension.
    columns:
      - name: rate_code_id
        tests:
          - not_null
          - unique
          